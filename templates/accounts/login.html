{% extends "base.html" %}
{% block title %}Log in | MEEM{% endblock %}
{% block content %}
<section class="pagehead"><div class="wrap narrow">
  <span class="eyebrow">Welcome back</span><h1 style="margin:14px 0 24px">Log in<span class="stop">.</span></h1>
  <form method="post" class="form-card">{% csrf_token %}
    {% include "_fields.html" %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <button class="btn btn-p" type="submit">Log in</button>
    <p class="small muted mt">New to MEEM? <a class="linkbtn" href="{% url 'accounts:signup' %}">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
