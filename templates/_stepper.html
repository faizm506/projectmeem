<ol class="stepper" aria-label="Checkout steps">
  <li class="{% if step > 1 %}done{% elif step == 1 %}now{% endif %}"><span>1</span><em>Cart</em></li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}now{% endif %}"><span>2</span><em>Details</em></li>
  <li class="{% if step > 3 %}done{% elif step == 3 %}now{% endif %}"><span>3</span><em>Payment</em></li>
  <li class="{% if step == 4 %}now{% endif %}"><span>4</span><em>Done</em></li>
</ol>
